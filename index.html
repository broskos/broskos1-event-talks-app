<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Technical Talks Event</title>
  <style>
    body {
      font-family: sans-serif;
      margin: 0;
      background-color: #f4f4f4;
    }

    header {
      background-color: #333;
      color: #fff;
      padding: 1rem;
      text-align: center;
    }

    .search-container {
      margin-top: 1rem;
    }

    #category-search {
      padding: 0.5rem;
      width: 300px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    #schedule-container {
      max-width: 800px;
      margin: 2rem auto;
      padding: 1rem;
    }

    .talk {
      background-color: #fff;
      border: 1px solid #ddd;
      border-radius: 5px;
      margin-bottom: 1rem;
      padding: 1rem;
    }

    .talk h2 {
      margin-top: 0;
    }

    .talk p {
      margin-bottom: 0.5rem;
    }

    .talk .speakers {
      font-style: italic;
    }

    .talk .categories {
      margin-top: 1rem;
    }

    .talk .categories span {
      background-color: #eee;
      border-radius: 3px;
      display: inline-block;
      margin-right: 0.5rem;
      padding: 0.25rem 0.5rem;
    }

    .break {
      background-color: #e9e9e9;
      text-align: center;
      padding: 1rem;
      margin-bottom: 1rem;
      border-radius: 5px;
    }
  </style>
</head>
<body>
  <header>
    <h1>Technical Talks Event</h1>
    <div class="search-container">
      <input type="text" id="category-search" placeholder="Search by category...">
    </div>
  </header>
  <main id="schedule-container">
    <!-- Schedule will be generated by JavaScript -->
  </main>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const scheduleContainer = document.getElementById('schedule-container');
      const searchInput = document.getElementById('category-search');
      const talks = [
        {
          "title": "The Future of Artificial Intelligence",
          "speakers": ["Dr. Evelyn Reed"],
          "categories": ["AI", "Machine Learning"],
          "duration": 60,
          "description": "A deep dive into the future of AI and its impact on society."
        },
        {
          "title": "Building Scalable Web Applications",
          "speakers": ["John Smith", "Jane Doe"],
          "categories": ["Web Development", "Scalability"],
          "duration": 60,
          "description": "Learn how to build web applications that can handle millions of users."
        },
        {
          "title": "The Rise of Quantum Computing",
          "speakers": ["Dr. Alan Grant"],
          "categories": ["Quantum Computing", "Physics"],
          "duration": 60,
          "description": "An introduction to the mind-bending world of quantum computing."
        },
        {
          "title": "Cybersecurity in the Modern Age",
          "speakers": ["Chris Roberts"],
          "categories": ["Cybersecurity", "Networking"],
          "duration": 60,
          "description": "Protecting your digital assets in an increasingly connected world."
        },
        {
          "title": "The Power of Big Data",
          "speakers": ["Dr. Ian Malcolm"],
          "categories": ["Big Data", "Analytics"],
          "duration": 60,
          "description": "Harnessing the power of big data to drive business decisions."
        },
        {
          "title": "A-Frame: VR on the Web",
          "speakers": ["Ellie Sattler", "Ada Lovelace"],
          "categories": ["Web Development", "VR"],
          "duration": 60,
          "description": "Creating immersive virtual reality experiences with web technologies."
        }
      ];

      renderSchedule(talks);

      searchInput.addEventListener('input', () => {
        const searchTerm = searchInput.value.toLowerCase();
        const filteredTalks = talks.filter(talk =>
          talk.categories.some(category =>
            category.toLowerCase().includes(searchTerm)
          )
        );
        renderSchedule(filteredTalks);
      });

      function renderSchedule(talksToRender) {
        scheduleContainer.innerHTML = '';
        let startTime = new Date();
        startTime.setHours(10, 0, 0, 0);

        talksToRender.forEach((talk, index) => {
          const talkElement = createTalkElement(talk, startTime);
          scheduleContainer.appendChild(talkElement);

          startTime.setMinutes(startTime.getMinutes() + talk.duration);

          if (index < talksToRender.length - 1) {
            if (index === 2) { // Lunch break after the 3rd talk
              const lunchBreakElement = createBreakElement('Lunch Break', startTime);
              scheduleContainer.appendChild(lunchBreakElement);
              startTime.setMinutes(startTime.getMinutes() + 60);
            } else {
              const breakElement = createBreakElement('Transition', startTime);
              scheduleContainer.appendChild(breakElement);
              startTime.setMinutes(startTime.getMinutes() + 10);
            }
          }
        });
      }

      function createTalkElement(talk, startTime) {
        const talkElement = document.createElement('div');
        talkElement.classList.add('talk');

        const endTime = new Date(startTime.getTime() + talk.duration * 60000);
        const timeString = `${formatTime(startTime)} - ${formatTime(endTime)}`;

        talkElement.innerHTML = `
          <h3>${timeString}</h3>
          <h2>${talk.title}</h2>
          <p class="speakers">By: ${talk.speakers.join(', ')}</p>
          <p>${talk.description}</p>
          <div class="categories">
            ${talk.categories.map(category => `<span>${category}</span>`).join('')}
          </div>
        `;
        return talkElement;
      }

      function createBreakElement(title, startTime) {
        const breakElement = document.createElement('div');
        breakElement.classList.add('break');
        const breakDuration = title === 'Lunch Break' ? 60 : 10;
        const endTime = new Date(startTime.getTime() + breakDuration * 60000);
        const timeString = `${formatTime(startTime)} - ${formatTime(endTime)}`;

        breakElement.innerHTML = `<h3>${timeString}</h3><p>${title}</p>`;
        return breakElement;
      }

      function formatTime(date) {
        return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      }
    });
  </script>
</body>
</html>
